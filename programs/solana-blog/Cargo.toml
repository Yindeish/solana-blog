[package]
name = "solana-blog"
version = "0.1.0"
description = "A simple, fully on-chain blog program for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_blog"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1" }
